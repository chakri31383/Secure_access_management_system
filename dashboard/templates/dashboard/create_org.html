{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

    <h2>Create New Organization</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Organization Name -->
        <div class="form-group">
            <label for="org_name">Organization Name</label>
            <input type="text" class="form-control" id="org_name"
                   name="name" placeholder="Enter organization name" required>
        </div>

        <!-- Select User as Org Admin -->
        <div class="form-group mt-3">
            <label for="admin_user_id">Assign Organization Admin</label>
            <select name="admin_user_id" class="form-control" id="admin_user_id" required>
                <option value="">-- Select User --</option>

                {% for u in users %}
                    <option value="{{ u.id }}">{{ u.full_name }} ({{ u.email }})</option>
                {% endfor %}
            </select>

            <small class="form-text text-muted">
                Only users without an assigned organization are shown.
            </small>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Create Organization</button>
    </form>

    <!-- Alert Messages -->
    {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

</div>

{% endblock %}
