{% extends 'accounts/base.html' %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height:70vh;">
  <div class="card shadow-lg p-4 bg-light text-dark" style="width:400px;">
    <h4 class="text-center mb-3 text-success">Verify OTP</h4>
    <p class="text-center small text-muted">Enter the 6-digit OTP sent to your email.</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-success w-100 mt-2" type="submit">Verify OTP</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'forgot_password' %}" class="text-decoration-none">Resend OTP</a>
    </div>
  </div>
</div>
{% endblock %}
