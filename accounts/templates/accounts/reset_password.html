{% extends 'accounts/base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height:70vh;">
  <div class="card shadow-lg p-4 bg-light text-dark" style="width:400px;">
    <h4 class="text-center mb-3 text-danger">Reset Password</h4>
    <p class="text-center small text-muted">Enter and confirm your new password.</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-danger w-100 mt-2" type="submit">Reset Password</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
