{% extends 'accounts/base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height:70vh;">
  <div class="card shadow-lg p-4 bg-light text-dark" style="width:400px;">
    <h4 class="text-center mb-3 text-primary">Forgot Password</h4>
    <p class="text-center small text-muted">Enter your registered email to receive a 6-digit OTP.</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100 mt-2" type="submit">Send OTP</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
