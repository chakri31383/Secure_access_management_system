{% extends 'accounts/base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height:70vh;">
  <div class="card shadow-lg p-4 bg-light text-dark" style="width:400px;">
    <h4 class="text-center text-danger mb-3">Set New Password</h4>
    <p class="text-center small text-muted">Enter your new password below.</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-danger w-100" type="submit">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
