{% extends 'accounts/base.html' %}
{% block title %}Reset via Email{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height:70vh;">
  <div class="card shadow-lg p-4 bg-light text-dark" style="width:400px;">
    <h4 class="text-center text-primary mb-3">Forgot Password</h4>
    <p class="text-center small text-muted">Enter your registered email to get a password reset link.</p>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
