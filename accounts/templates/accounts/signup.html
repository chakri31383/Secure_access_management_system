{% extends 'accounts/base.html' %}
{% block title %}Sign Up{% endblock %}

{% block content %}

<style>
/* Background */
.signup-bg {
    background: white;
    min-height: 85vh;
    padding-top: 40px;
}

/* Main card */
.signup-card {
    background: white;
    width: 420px;
    margin: auto;
    padding: 40px 35px;
    border-radius: 25px;
    box-shadow: 0px 10px 40px rgba(0,0,0,0.15);
    animation: fadeIn 0.4s ease;
}

/* Heading */
.signup-card h3 {
    font-weight: 700;
    margin-bottom: 25px;
    text-align: center;
}

/* Input styling */
.signup-card input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 15px;
    background: #f3f6ff;
}

/* Button styling */
.signup-btn {
    width: 100%;
    background: #4a6cf7;
    padding: 12px;
    border-radius: 25px;
    color: white;
    font-weight: 600;
    border: none;
    margin-top: 10px;
    transition: 0.25s;
}

.signup-btn:hover {
    background: #3c56d6;
    transform: translateY(-2px);
}

/* Fade in animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<div class="signup-bg">

    <div class="signup-card">

        <h3>Create Your Account</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="signup-btn">Register</button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}" style="color:#4a6cf7; font-weight:600;">
                Already have an account?
            </a>
        </div>

    </div>

</div>

{% endblock %}
