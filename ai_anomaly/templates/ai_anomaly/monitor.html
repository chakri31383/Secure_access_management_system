{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="container py-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="mb-0">AI Anomaly Monitor</h3>
      <small class="text-muted">
        Real-time behavioral analysis using machine learning
      </small>
    </div>
    <a href="{% url 'dashboard:admin_dashboard' %}" class="btn btn-outline-secondary btn-sm">
      ← Back to Dashboard
    </a>
  </div>

  <div class="row g-4">

    <!-- Controls -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="mb-3">User Activity Simulation</h5>
          <p class="text-muted small">
            Adjust sliders (0–60). Any value above <strong>40</strong> is treated as abnormal.
          </p>

          <!-- Downloads -->
          <label class="form-label">Downloads: <span id="dVal">5</span></label>
          <input type="range" class="form-range" id="downloads" min="0" max="60" value="5">
          <div class="progress mb-3">
            <div id="dBar" class="progress-bar"></div>
          </div>

          <!-- Files -->
          <label class="form-label">Files Uploaded: <span id="fVal">2</span></label>
          <input type="range" class="form-range" id="files" min="0" max="60" value="2">
          <div class="progress mb-3">
            <div id="fBar" class="progress-bar bg-info"></div>
          </div>

          <!-- Failed Logins -->
          <label class="form-label">Failed Logins: <span id="lVal">0</span></label>
          <input type="range" class="form-range" id="logins" min="0" max="60" value="0">
          <div class="progress mb-4">
            <div id="lBar" class="progress-bar bg-danger"></div>
          </div>

          <!-- Buttons -->
          <div class="d-flex gap-2">
            <button class="btn btn-primary" onclick="detectAnomaly()">
              Detect Anomaly
            </button>
            <button class="btn btn-outline-danger" onclick="resetUI()">
              Reset
            </button>
            <span id="status" class="badge bg-success ms-auto align-self-center">
              Normal
            </span>
          </div>

        </div>
      </div>
    </div>

    <!-- Logs -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="mb-3">Detection Logs</h5>
          <div id="logBox"
               style="height:260px;overflow:auto;background:#0f172a;color:#e5e7eb;
               font-family:monospace;font-size:13px;padding:12px;border-radius:8px;">
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const THRESHOLD = 40;

function updateBars() {
  const d = downloads.value;
  const f = files.value;
  const l = logins.value;

  dVal.innerText = d;
  fVal.innerText = f;
  lVal.innerText = l;

  dBar.style.width = (d/60*100)+'%';
  fBar.style.width = (f/60*100)+'%';
  lBar.style.width = (l/60*100)+'%';
}

downloads.oninput = files.oninput = logins.oninput = updateBars;
updateBars();

function log(msg){
  const t = new Date().toLocaleTimeString();
  logBox.innerHTML = `[${t}] ${msg}<br>` + logBox.innerHTML;
}

function detectAnomaly(){
  const d = downloads.value;
  const f = files.value;
  const l = logins.value;

  log(`Checking: D=${d}, F=${f}, FL=${l}`);

  if(d>THRESHOLD || f>THRESHOLD || l>THRESHOLD){
    status.innerText = "ANOMALY";
    status.className = "badge bg-danger";
    log("🚨 Anomaly detected → User blocked (simulated)");
    downloads.disabled = files.disabled = logins.disabled = true;
  } else {
    status.innerText = "Normal";
    status.className = "badge bg-success";
    log("✅ Normal behavior");
  }
}

function resetUI(){
  downloads.value = 5;
  files.value = 2;
  logins.value = 0;
  downloads.disabled = files.disabled = logins.disabled = false;
  status.innerText = "Normal";
  status.className = "badge bg-success";
  updateBars();
  log("Reset performed");
}
</script>

{% endblock %}
